# =============================================================================
# BingWLP — Docker Compose (alternativa al deploy nginx + systemd)
# =============================================================================
#
# Avvio (dalla root del repo):
#   cp deploy/bingwlp.env.example deploy/bingwlp.env   # poi adattare i valori
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Log / stato:
#   docker compose -f deploy/docker-compose.yml logs -f bingwlp
#   docker compose -f deploy/docker-compose.yml ps
#
# Stop:
#   docker compose -f deploy/docker-compose.yml down          # mantiene i volumi
#   docker compose -f deploy/docker-compose.yml down -v       # CANCELLA i volumi
#
# Con reverse proxy (nginx) davanti al container:
#   docker compose -f deploy/docker-compose.yml --profile proxy up -d --build
#   (la porta 8080 del container NON deve essere pubblicata sull'host in quel caso)
#
# ATTENZIONE AL FILE ENV: deploy/bingwlp.env è pensato per il deploy con nginx
# (HOST=127.0.0.1, SERVE_STATIC=false). Dentro il container il backend è anche
# il web server statico, quindi qui HOST/PORT/SERVE_STATIC/STATIC_DIR vengono
# SOVRASCRITTI dal blocco `environment:` (che ha precedenza su env_file).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Applicazione (Node/Fastify, serve API + frontend statico)
  # ---------------------------------------------------------------------------
  bingwlp:
    container_name: bingwlp
    # Il context è la ROOT del repo: servono i due workspace (server + web).
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: bingwlp:latest

    # Riavvio automatico: sopravvive a reboot del host e a crash del processo
    # (a meno di uno stop esplicito). `always` è troppo aggressivo in development.
    restart: unless-stopped

    # Variabili comuni (DEFAULT_MARKET, LOG_LEVEL, TTL cache, RATE_LIMIT_MAX, ...).
    # Copiare deploy/bingwlp.env.example in deploy/bingwlp.env prima dell'avvio.
    env_file:
      - ./bingwlp.env

    # Override NON negoziabili del container (vince su env_file).
    environment:
      NODE_ENV: production
      # Dentro il container non c'è nginx: il bind deve accettare da fuori.
      HOST: 0.0.0.0
      PORT: "8080"
      # Il backend DEVE servire il build del frontend: /app/web/dist è nell'immagine.
      SERVE_STATIC: "true"
      STATIC_DIR: /app/web/dist
      IMAGE_STORE_DIR: /var/lib/bingwlp/images

    ports:
      # Espone l'app su tutte le interfacce host. Se c'è un reverse proxy
      # davanti (profilo `proxy`) o se non si vuole esposizione pubblica,
      # usare il binding loopback: "127.0.0.1:8080:8080".
      - "8080:8080"

    volumes:
      # Store immagini (futuro: IMAGE_STORE=fs non implementato).
      # Predisposto ora così l'eventuale attivazione non richiede modifiche.
      - bingwlp-data:/var/lib/bingwlp

    # Healthcheck coerente con quello dell'immagine (`node -e` + fetch nativo).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    # init: true fa da PID 1 (ridondante con dumb-init nell'immagine: innocuo,
    # garantisce il comportamento corretto anche se si rimuove dumb-init).
    init: true

    # Log del container limitati: senza questo un processo verboso può riempire
    # il disco dell'host.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # Hardening equivalente a quello della unit systemd (versione container).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # -------------------------------------------------------------------------
    # PROFILO "proxy" (opzionale): reverse proxy TLS/gzip/cache davanti all'app.
    # -------------------------------------------------------------------------
    # NON attivo di default: senza `--profile proxy` questo blocco è ignorato.
    # Le due varianti (nginx o caddy) sono entrambe commentate perché attivarne
    # una sola è la scelta normale.
    #
    # VARIANTE A — nginx (riusa un server block dedicato, vedi deploy/nginx/):
    #   proxy:
    #     image: nginx:1.24-alpine
    #     restart: unless-stopped
    #     profiles: ["proxy"]
    #     depends_on:
    #       bingwlp:
    #         condition: service_healthy
    #     ports:
    #       - "80:80"
    #       - "443:443"
    #     volumes:
    #       - ./nginx/bingwlp.conf:/etc/nginx/conf.d/default.conf:ro
    #       # NB: nel container l'upstream è il NOME DEL SERVIZIO, non 127.0.0.1:
    #       #     proxy_pass http://bingwlp:8080;  (adattare il file nginx)
    #       - certbot-webroot:/var/www/certbot:ro
    #       - certbot-certs:/etc/letsencrypt:ro
    #
    # VARIANTE B — Caddy (TLS automatico in 2 righe, il più semplice):
    #   caddy:
    #     image: caddy:2-alpine
    #     restart: unless-stopped
    #     profiles: ["proxy"]
    #     depends_on: [bingwlp]
    #     ports:
    #       - "80:80"
    #       - "443:443"
    #     environment:
    #       DOMAIN: wallpaper.example.com
    #     volumes:
    #       - caddy-data:/data
    #       - caddy-config:/config
    #       - ./Caddyfile:/etc/caddy/Caddyfile:ro
    #     # Deploy/Caddyfile deve contenere:
    #     #   {$DOMAIN} {
    #     #     encode gzip
    #     #     reverse_proxy bingwlp:8080
    #     #   }
    #     # Caddy gestisce da solo certificato Let's Encrypt + rinnovo.

volumes:
  # Dati persistenti dell'app (image store futuro): sopravvive a down/up.
  bingwlp-data:
  # Volumi usati solo dal profilo `proxy` (decommentare con il proxy scelto).
  # certbot-webroot:
  # certbot-certs:
  # caddy-data:
  # caddy-config:
