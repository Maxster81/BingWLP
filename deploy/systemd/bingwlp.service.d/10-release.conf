# =============================================================================
# BingWLP — drop-in systemd per il DEPLOY ATOMICO
# =============================================================================
#
# Installazione (facoltativa, da usare SOLO con il layout a release):
#   sudo mkdir -p /etc/systemd/system/bingwlp.service.d
#   sudo install -m 0644 deploy/systemd/bingwlp.service.d/10-release.conf \
#        /etc/systemd/system/bingwlp.service.d/10-release.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart bingwlp
#
# A COSA SERVE
# Con il layout atomico (scripts/deploy.sh) il codice non è più in /opt/bingwlp
# ma in release immutabili:
#
#   /opt/bingwlp/releases/20260928-120301/   ← release (immutabile)
#   /opt/bingwlp/releases/20260928-113000/   ← release precedente (per rollback)
#   /opt/bingwlp/current  -> releases/20260928-120301   ← symlink atomico
#
# Il processo deve girare NELLA release puntata da `current`, quindi la
# WorkingDirectory della unit va sovrascritta: un drop-in è la via corretta
# (non si modifica la unit base, che resta identica per tutti i deploy).
#
# Un drop-in systemd si legge come WELL-KNOWN DELTA: `ExecStart` NON va
# ridefinito perché il percorso `server/dist/index.js` è RELATIVO alla
# WorkingDirectory, che è l'unica cosa che cambia.
#
# ROLLBACK
# scripts/deploy.sh riporta il symlink `current` alla release precedente e fa
# `systemctl restart bingwlp`: con questo drop-in il processo riparte dalla
# vecchia release senza toccare né la unit né i file già pubblicati.
# =============================================================================

[Service]
# WorkingDirectory segue il symlink `current`: è l'unico punto di switch.
# systemd risolve il path al momento della lettura, quindi un symlink che
# viene ripuntato è sufficiente.
WorkingDirectory=/opt/bingwlp/current

# Se un deploy lascia un symlink rotto (current → release cancellata),
# l'avvio fallisce in modo rumoroso invece di partire con cwd indefinita:
# + su WorkingDirectory in systemd 240+ rende l'errore esplicito nel journal.
# (Con symlink assente systemd usa / come cwd: questo è il caso da evitare —
# scripts/deploy.sh non rimuove mai `current` prima di aver creato la release.)
