# =============================================================================
# BingWLP — server block nginx (Ubuntu 22.04 / 24.04, nginx 1.24)
# =============================================================================
#
# Installazione (lo fa anche scripts/install-ubuntu.sh):
#   sudo install -m 0644 deploy/nginx/bingwlp.conf \
#        /etc/nginx/sites-available/bingwlp.conf
#   sudo ln -sfn /etc/nginx/sites-available/bingwlp.conf \
#        /etc/nginx/sites-enabled/bingwlp.conf
#   sudo rm -f /etc/nginx/sites-enabled/default      # evita il default_server
#   sudo nginx -t && sudo systemctl reload nginx
#
# Questo file è VOLUTAMENTE solo HTTP (porta 80): il TLS lo aggiunge certbot
# con `certbot --nginx -d wallpaper.example.com`, che riscrive questo file
# inserendo un blocco `listen 443 ssl` e il redirect 80→443.
# Non aggiungere `listen 443` a mano: certbot gestirebbe comunque i suoi.
#
# TOPOLOGIA
#   browser ──▶ nginx (80/443) ──┬─▶ /var/www/bingwlp/web/dist   (SPA, statico)
#                                └─▶ 127.0.0.1:8080 /api/*       (Node/Fastify)
#
# Il backend gira con SERVE_STATIC=false: lo statico lo serve SOLO nginx.
# Vedi docs/DEPLOY.md § "Perché nginx serve il frontend" per le alternative.
# =============================================================================

server {
    # -------------------------------------------------------------------------
    # Ascolto
    # -------------------------------------------------------------------------
    listen 80;
    listen [::]:80;

    # Sostituire con il proprio dominio PRIMA del primo `nginx -t`.
    # Il placeholder `_` (catch-all) funziona ma deve restare l'unico
    # server block con `listen 80 default_server`: qui NON lo mettiamo.
    server_name wallpaper.example.com;

    # -------------------------------------------------------------------------
    # Radice dei file statici
    # -------------------------------------------------------------------------
    # `/var/www/bingwlp/web/dist` è un symlink al build del release corrente
    # (lo aggiorna in modo atomico scripts/deploy.sh):
    #   /var/www/bingwlp/web/dist -> /opt/bingwlp/current/web/dist
    # nginx segue i symlink, quindi la config non cambia mai tra i deploy.
    root /var/www/bingwlp/web/dist;
    index index.html;

    # -------------------------------------------------------------------------
    # Hardening di base
    # -------------------------------------------------------------------------
    # Nasconde la versione di nginx nelle risposte e nelle pagine di errore.
    server_tokens off;

    # Limite sul body delle richieste: l'app è GET-only lato API, 10m è già
    # abbondante e blocca upload accidentali/abusi a costo zero.
    client_max_body_size 10m;

    # Timeout lato client: il caso peggiore è un download di immagine grande.
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # -------------------------------------------------------------------------
    # Log
    # -------------------------------------------------------------------------
    # Log dedicati: non si mescolano con gli altri virtual host.
    access_log /var/log/nginx/bingwlp.access.log;
    error_log  /var/log/nginx/bingwlp.error.log warn;

    # -------------------------------------------------------------------------
    # Header di sicurezza (a livello server)
    # -------------------------------------------------------------------------
    # ATTENZIONE (regola di nginx): gli `add_header` NON sono ereditati da un
    # `location` che dichiara a sua volta almeno un `add_header`. Per questo
    # ogni location che usa add_header (cache) li RIPETE: vedi i blocchi
    # "header di sicurezza (replicati)" più sotto. Se ne aggiungete uno qui,
    # aggiungetelo anche là.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP compatibile con il funzionamento reale dell'app:
    #  - img-src include https://www.bing.com perché /api/image risponde 302
    #    verso il CDN Bing e il BROWSER carica l'immagine da lì (dominio diverso
    #    da 'self'): senza questo host la galleria resta vuota.
    #  - data: serve per favicon/gradient inline e placeholder.
    #  - media-src include download.microsoft.com: i temi animati usano un MP4
    #    ospitato su quel dominio.
    #  - style-src ha 'unsafe-inline' perché React applica stili inline per
    #    transizioni/layout dinamici; script-src resta pulito ('self'), il build
    #    Vite non emette script inline.
    #  - frame-ancestors 'self' + X-Frame-Options SAMEORIGIN: nessun embedding
    #    da siti terzi (anti clickjacking).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: https://www.bing.com; media-src 'self' https://download.microsoft.com; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'" always;


    # -------------------------------------------------------------------------
    # Compressione
    # -------------------------------------------------------------------------
    # Attiva per HTML/CSS/JS/JSON/SVG. Le immagini JPEG/PNG/WEBP NON vanno
    # compresse (sono già compressi: si sprecherebbe CPU per 0 byte risparmiati).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        text/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    # NB: `gzip_static on;` servirebbe i .gz precompilati da `vite build`.
    # Vite non li produce di default; il modulo ngx_http_gzip_static è incluso
    # nel pacchetto nginx di Ubuntu, ma per non rischiare un `nginx -t` fallito
    # su una build custom lo lasciamo commentato: attivatelo se generate .gz.
    # gzip_static on;

    # -------------------------------------------------------------------------
    # API → backend Node/Fastify (127.0.0.1:8080)
    # -------------------------------------------------------------------------
    location /api/ {
        # proxy_pass SENZA path finale: l'URI originale (/api/...) viene
        # inoltrato così com'è. Le rotte del backend sono montate con
        # prefix '/api' (vedi server/src/app.ts), quindi non serve riscrivere.
        proxy_pass http://127.0.0.1:8080;

        # HTTP/1.1 + keepalive verso Node (Fastify li gestisce).
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Header di inoltro: il backend (e i log) devono vedere l'IP reale
        # del client e lo schema originale, altrimenti l'IP è sempre 127.0.0.1.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Timeout: /api/themes e /api/images possono attendere Bing (fino a
        # UPSTREAM_TIMEOUT_MS=8000 nel backend). 60s copre con margine anche
        # un primo riempimento di cache. /api/download è streammato.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Se il backend è giù, nginx risponde 502 (vedi troubleshooting in
        # docs/DEPLOY.md). Non sostituire con una pagina statica: il frontend
        # mostra il proprio messaggio leggendo il JSON di errore.
        proxy_buffering on;
    }

    # Healthcheck: `GET /api/health` risponde sempre JSON 200 con lo stato di
    # processo, upstream Bing e cache. Serve a uptime-checker esterni, a
    # scripts/deploy.sh e a Docker HEALTHCHECK. È già coperto da
    # `location /api/`: questo blocco esiste solo per rendere esplicito che
    # NON va protetto/limitato, e per dare timeout più aggressivi.
    location = /api/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }

    # -------------------------------------------------------------------------
    # Asset con hash in /assets/  → cache "immutable" 1 anno
    # -------------------------------------------------------------------------
    # Vite emette i bundle in `dist/assets/<nome>-<hash>.<ext>`: il nome cambia
    # a ogni build, quindi il contenuto di un dato URL non cambia MAI.
    # `immutable` autorizza il browser a non rivalidare nemmeno su F5: è la
    # cache più aggressiva possibile ed è corretta solo con hash nel nome.
    # `^~` impedisce che le regex successive abbiano la precedenza.
    location ^~ /assets/ {
        # Expires/Cache-Control dati da `expires`; l'`immutable` va aggiunto a parte.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # HT: `add_header` qui azzera l'ereditarietà → header di sicurezza replicati.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Il file può stare o non stare: `try_files` senza fallback → 404 reale
        # (NON deve servire index.html: un asset mancante è un errore, non una rotta SPA).
        try_files $uri =404;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Altre estensioni statiche fuori da /assets/ (favicon, og-image, ...)
    # -------------------------------------------------------------------------
    # Qui la cache è più corta (30 giorni) perché questi file NON hanno hash nel
    # nome e potrebbero cambiare tra un deploy e l'altro.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;

        # Header di sicurezza replicati (vedi nota add_header più sopra).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        try_files $uri =404;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # index.html → MAI in cache
    # -------------------------------------------------------------------------
    # È il punto d'ingresso della SPA: dentro referenzia gli asset con hash.
    # Se il browser lo cachasse, dopo un deploy continuerebbe a chiedere i
    # bundle vecchi → schermata bianca / "Failed to fetch dynamically imported
    # module". `no-store` lo impedisce, `no-cache`/`must-revalidate` (variante
    # più morbida) basta comunque a forzare la rivalidazione.
    #
    # `location = /index.html` intercetta anche il redirect interno generato da
    # `try_files ... /index.html` nel blocco `location /` (nginx riesegue il
    # matching sulle location dopo un internal redirect): per questo la regola
    # vale davvero per tutte le rotte SPA.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;

        # Header di sicurezza replicati (vedi nota add_header più sopra).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Niente `expires`: `expires off` evita che nginx aggiunga un max-age.
        expires off;
    }

    # -------------------------------------------------------------------------
    # SPA fallback (rotta principale)
    # -------------------------------------------------------------------------
    # Il frontend usa un hash router, quindi di fatto non ci sono path profondi,
    # ma la regola `try_files` rende l'app corretta anche se domani si passasse
    # a un router con History API:
    #   1. file reale richiesto          → servilo
    #   2. directory reale               → indice della directory
    #   3. qualunque altra cosa (GET)    → /index.html (che è no-store)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Blocchi di sicurezza: file nascosti e metadati
    # -------------------------------------------------------------------------
    # Niente accesso a .git/.env/file che iniziano con punto sotto la web root.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # favicon e robots opzionali: se assenti meglio un 204 che un 404 nei log.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =204;
    }
    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =204;
    }
}

